name: Bootstrap interview data

on:
  push:
    paths:
      - '.github/workflows/bootstrap-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source data
        run: |
          mkdir -p data
          curl -fL --retry 3 --retry-delay 2 \
            'https://app-a2h9qc.v2.appdeploy.ai/resources/yanggok-interview-full-data.json.gz' \
            -o /tmp/full-data.json.gz
      - name: Filter and split data
        run: |
          python - <<'PY'
          import gzip, json, base64, re
          from pathlib import Path

          with gzip.open('/tmp/full-data.json.gz','rt',encoding='utf-8') as f:
              raw=json.load(f)
          p=raw['p']
          allowed={'대학공개','대학기출','후기·기출'}
          qlike=re.compile(r'(\?|무엇|어떤|어떻게|왜|이유|설명|말해|이야기|생각|의견|느낀|배운|지원|활동|경험|역할|과정|방법|계기|장점|단점|해결|논하|서술|제시)')
          reject=re.compile(r'(평가요소|평가항목|배점|면접위원|면접시간|준비시간|답변시간|전형요소별|모집인원|지원인원|경쟁률|페이지|목차)')

          def year_ok(y):
              ys=[int(x) for x in re.findall(r'20\d{2}',str(y or ''))]
              return not ys or max(ys)<=2026
          def good(r):
              kind=p['k'][r[9]] if r[9] < len(p['k']) else ''
              if kind not in allowed: return False
              y=p['y'][r[4]] if r[4] < len(p['y']) else ''
              if not year_ok(y): return False
              s=' '.join(str(r[6] or '').split())
              return 12 <= len(s) <= 700 and not reject.search(s) and bool(qlike.search(s))

          raw['q']=[r for r in raw['q'] if good(r)]
          assert len(raw['q'])==30915, f"unexpected question count: {len(raw['q'])}"
          payload=json.dumps(raw,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          packed=gzip.compress(payload,compresslevel=9)
          b64=base64.b64encode(packed).decode('ascii')
          out=Path('data')
          for old in out.glob('data-*.b64'): old.unlink()
          size=(len(b64)+15)//16
          for i in range(16):
              (out/f'data-{i+1:02}.b64').write_text(b64[i*size:(i+1)*size],encoding='utf-8')
          print('questions=',len(raw['q']),'base64=',len(b64))
          PY
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data-*.b64
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'Add filtered interview question data'
            git push
          fi
