name: Migration checks

on:
  push:
    branches: [appdeploy-v42-migration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check frontend JavaScript
        run: |
          for f in app-*.js config.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check Apps Script syntax
        run: |
          cat gas/Code-*.gs > /tmp/Code.js
          node --check /tmp/Code.js
